<!-- Contact Form Section -->
<section id="contact" class="contact-section">
    <div class="container">
        <div class="section-header">
            <h2>Get In Touch</h2>
            <p>Have a question or want to work together? I'd love to hear from you.</p>
        </div>

        <div class="contact-container">
            <!-- Contact Form -->
            <div class="contact-form-wrapper">
                <form class="contact-form" id="contactForm" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
                    <div class="form-group">
                        <label for="name">Your Name *</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            required 
                            placeholder="Enter your full name"
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email *</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            placeholder="your-email@example.com"
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input 
                            type="text" 
                            id="subject" 
                            name="subject" 
                            placeholder="What is this about?"
                            autocomplete="off"
                        >
                    </div>

                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea 
                            id="message" 
                            name="message" 
                            rows="6" 
                            required 
                            placeholder="Tell me more about your project or question..."
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Send Message</button>
                    <p class="form-note">* Required fields</p>
                </form>
            </div>

            <!-- Contact Information -->
            <div class="contact-info">
                <div class="info-card">
                    <div class="info-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <h3>Email</h3>
                    <p><a href="mailto:hello@andrew.com">hello@andrew.com</a></p>
                </div>

                <div class="info-card">
                    <div class="info-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <h3>Location</h3>
                    <p>Nigeria</p>
                </div>

                <div class="info-card">
                    <div class="info-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h3>Response Time</h3>
                    <p>Usually within 24 hours</p>
                </div>

                <div class="social-connect">
                    <h3>Connect With Me</h3>
                    <div class="social-links">
                        <a href="https://github.com" target="_blank" title="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="https://linkedin.com" target="_blank" title="LinkedIn">
                            <i class="fab fa-linkedin"></i>
                        </a>
                        <a href="https://twitter.com" target="_blank" title="Twitter">
                            <i class="fab fa-x-twitter"></i>
                        </a>
                        <a href="mailto:hello@andrew.com" title="Email">
                            <i class="fas fa-envelope"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- JavaScript for Form Handling -->
<script>
// Contact Form Submission Handler
const contactForm = document.getElementById('contactForm');

if (contactForm) {
    contactForm.addEventListener('submit', function(e) {
        // Formspree will handle submission, but we can add client-side validation
        
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();

        // Validate fields
        if (!name || !email || !message) {
            e.preventDefault();
            alert('Please fill in all required fields');
            return;
        }

        // Email validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            e.preventDefault();
            alert('Please enter a valid email address');
            return;
        }

        // Show loading state
        const submitBtn = contactForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Sending...';
        submitBtn.disabled = true;

        // Restore button after submission (Formspree redirects, but just in case)
        setTimeout(() => {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }, 3000);
    });
}
</script>

       - Add EmailJS library to index.html:
         <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/build/index.min.js"></script>
       - Initialize and use EmailJS in script.js
    
    3. NETLIFY FORMS (If deployed on Netlify):
       - Add netlify attribute to form: <form name="contact" method="POST" netlify>
       - Netlify will automatically handle submissions
       - Configure notifications in Netlify dashboard

       - Change form action to your API endpoint

       - Make sure CORS is configured
       - Handle response in JavaScript
